# Tests en cada PR y en master. Solo en master, y solo si pasan, compila la app sin firmar y la
# publica como release "latest": la firma (Apple ID gratuito) y la instalación en el iPhone las
# hace el NAS (ios-signer). Si los tests fallan, el iPhone se queda con la versión anterior.
# Un PR con la etiqueta "solo-capturas" (pruebas visuales que no van a master) se salta los tests:
# solo compila y saca las capturas de la prueba (`UITests/*ScreenshotTests.swift` salvo la de
# siempre, ScreenshotTests, que solo corre si no hay otra). Ver CLAUDE.md.
# (El fichero se sigue llamando build.yml para que el número de ejecución, que es el número de
# compilación de la app, siga creciendo.)
name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # poner o quitar solo-capturas relanza
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    # Domain y Application no pueden depender de frameworks de Apple: se prueban también en
    # Linux, con la misma imagen que en el NAS.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'solo-capturas') }}
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests del paquete (Linux)
        working-directory: Packages/GymCore
        env:
          PWA_DB_JSON: ${{ github.workspace }}/pwa/db.json   # los datos reales, para el test de importación
        run: swift test

  pwa-tests:
    # Cada test unitario de la PWA ya portado tiene su gemelo en Swift (mismo describe y nombre)
    # o un motivo en docs/pwa-tests-no-aplican.tsv. Ver CLAUDE.md.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'solo-capturas') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests de la PWA portados
        run: python3 scripts/pwa_tests.py pwa

  app:
    runs-on: macos-26
    env:
      SOLO_CAPTURAS: ${{ contains(github.event.pull_request.labels.*.name, 'solo-capturas') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para restore-mtimes.sh

      # Compilación incremental: la carpeta de compilación de Xcode y la de SwiftPM de la última
      # ejecución, con cada fichero en la fecha de su commit para que solo se recompile lo que
      # cambia. Las ejecuciones de master guardan la caché que usan las PR.
      - name: Fechas de los ficheros
        run: |
          scripts/restore-mtimes.sh
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - uses: actions/cache@v4
        with:
          path: |
            build
            Packages/GymCore/.build
          key: app-debug-${{ github.sha }}
          restore-keys: app-debug-

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          swift --version

      - name: Tests del paquete (macOS)
        if: env.SOLO_CAPTURAS != 'true'
        working-directory: Packages/GymCore
        run: swift test

      # El simulador arranca mientras se compila la app (con los tests del paquete a la vez, los
      # frena); los tests de la app esperan a que acabe.
      - name: Arrancar el simulador
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulador: $udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          # Sin teclado físico conectado, para que salga el de pantalla (KeyboardTests).
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$udid"
          [ "$SOLO_CAPTURAS" = true ] && exit 0   # sin reloj
          # El reloj del usuario: Apple Watch Series 10 de 46 mm o, si no está, otro de 46 mm (el
          # Series 11 de 46 mm, que tiene la misma pantalla).
          xcrun simctl list devices available | grep -i watch || true
          watch=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("watchOS")) | .value[]]
                     | (map(select(.name | contains("Series 10 (46mm)"))) + map(select(.name | contains("46mm"))))[0].udid')
          echo "Simulador del reloj: $watch"
          echo "WATCH_SIMULATOR=$watch" >> "$GITHUB_ENV"
          xcrun simctl boot "$watch"

      - name: Compilar la app y los tests
        run: |
          xcodebuild build-for-testing \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -destination "id=$SIMULATOR" \
            -derivedDataPath build \
            -showBuildTimingSummary \
            | tee build.log | tail -n 40
          status=${PIPESTATUS[0]}
          grep -E ': error:' build.log | sort -u | head -n 30 || true
          test "$status" -eq 0

      - name: Tests de la app en el simulador
        if: env.SOLO_CAPTURAS != 'true'
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcodebuild test-without-building \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -destination "id=$SIMULATOR" \
            -derivedDataPath build \
            -resultBundlePath Tests.xcresult \
            | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      # solo-capturas: las capturas solo salen arrancando la app, así que corren las clases de la
      # prueba y nada más.
      - name: Capturas en el simulador
        if: env.SOLO_CAPTURAS == 'true'
        run: |
          classes=$(ls UITests/*ScreenshotTests.swift | xargs -n1 basename | sed 's/\.swift$//' | grep -vx ScreenshotTests || true)
          [ -n "$classes" ] || classes=ScreenshotTests
          only=()
          for c in $classes; do only+=("-only-testing:GymCompanionUITests/$c"); done
          echo "Capturas de: $classes"
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcodebuild test-without-building \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -destination "id=$SIMULATOR" \
            -derivedDataPath build \
            -resultBundlePath Tests.xcresult \
            "${only[@]}" \
            | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      # La app del reloj, con su propio esquema y su simulador (capturas del reloj).
      - name: Compilar el reloj y sus tests
        if: env.SOLO_CAPTURAS != 'true'
        run: |
          xcodebuild build-for-testing \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanionWatch \
            -destination "id=$WATCH_SIMULATOR" \
            -derivedDataPath build \
            | tee build-watch.log | tail -n 40
          status=${PIPESTATUS[0]}
          grep -E ': error:' build-watch.log | sort -u | head -n 30 || true
          test "$status" -eq 0

      # Sin icono el reloj enseña la app con un círculo vacío, y ningún test lo ve.
      - name: El reloj lleva icono
        if: env.SOLO_CAPTURAS != 'true'
        run: |
          app=build/Build/Products/Debug-watchsimulator/GymCompanionWatch.app
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")
          test "$icon" = AppIcon
          test -f "$app/Assets.car"

      - name: Tests del reloj en el simulador
        if: env.SOLO_CAPTURAS != 'true'
        run: |
          xcrun simctl bootstatus "$WATCH_SIMULATOR" -b
          xcodebuild test-without-building \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanionWatch \
            -destination "id=$WATCH_SIMULATOR" \
            -derivedDataPath build \
            -resultBundlePath Watch.xcresult \
            | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Extraer capturas
        if: always()
        run: |
          mkdir -p capturas
          for result in Tests.xcresult Watch.xcresult; do
            [ -d "$result" ] || continue
            rm -rf attachments
            xcrun xcresulttool export attachments --path "$result" --output-path attachments
            jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' attachments/manifest.json \
              | while IFS=$'\t' read -r file name; do
                  # upload-artifact no admite " : < > | * ? en los nombres (salen en las descripciones de un fallo).
                  name=$(printf '%s' "${name%%_*}" | tr -d '":<>|*?')
                  cp "attachments/$file" "capturas/$name.png"
                done
          done
          ls capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas
          if-no-files-found: ignore

  release:
    needs: [core-linux, pwa-tests, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fechas de los ficheros   # ver el job app
        run: |
          scripts/restore-mtimes.sh
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - uses: actions/cache@v4
        with:
          path: build
          key: app-release-${{ github.sha }}
          restore-keys: app-release-

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild build \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GymCompanion.app Payload/
          zip -qr GymCompanion.ipa Payload
          shasum -a 256 GymCompanion.ipa | tee GymCompanion.ipa.sha256

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest GymCompanion.ipa GymCompanion.ipa.sha256 \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --target ${{ github.sha }}
