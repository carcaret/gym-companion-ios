# Tests en cada PR y en master. Solo en master, y solo si pasan, compila la app sin firmar y la
# publica como release "latest": la firma (Apple ID gratuito) y la instalación en el iPhone las
# hace el NAS (ios-signer). Si los tests fallan, el iPhone se queda con la versión anterior.
# (El fichero se sigue llamando build.yml para que el número de ejecución, que es el número de
# compilación de la app, siga creciendo.)
name: build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    if: false   # PR de prueba visual: solo las capturas (ver CLAUDE.md)
    # Domain y Application no pueden depender de frameworks de Apple: se prueban también en
    # Linux, con la misma imagen que en el NAS.
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests del paquete (Linux)
        working-directory: Packages/GymCore
        env:
          PWA_DB_JSON: ${{ github.workspace }}/pwa/db.json   # los datos reales, para el test de importación
        run: swift test

  pwa-tests:
    if: false   # PR de prueba visual
    # Cada test unitario de la PWA ya portado tiene su gemelo en Swift (mismo describe y nombre)
    # o un motivo en docs/pwa-tests-no-aplican.tsv. Ver CLAUDE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests de la PWA portados
        run: python3 scripts/pwa_tests.py pwa

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para restore-mtimes.sh

      # Compilación incremental: la carpeta de compilación de Xcode y la de SwiftPM de la última
      # ejecución, con cada fichero en la fecha de su commit para que solo se recompile lo que
      # cambia. Las ejecuciones de master guardan la caché que usan las PR.
      - name: Fechas de los ficheros
        run: |
          scripts/restore-mtimes.sh
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - uses: actions/cache@v4
        with:
          path: |
            build
            Packages/GymCore/.build
          key: app-debug-${{ github.sha }}
          restore-keys: app-debug-

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          swift --version

      # PR de prueba visual (ver CLAUDE.md): nada de tests ni reloj. Se compila la app, se arranca
      # el simulador del iPhone y cada captura sale abriendo la app en su pantalla con simctl.
      - name: Compilar la app y arrancar el simulador
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcodebuild build \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -destination "id=$udid" \
            -derivedDataPath build \
            | tee build.log | tail -n 20
          status=${PIPESTATUS[0]}
          grep -E ': error:' build.log | sort -u | head -n 30 || true
          test "$status" -eq 0

      - name: Capturas
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcrun simctl status_bar "$SIMULATOR" override --time 9:41 --batteryLevel 100 --batteryState charged
          xcrun simctl install "$SIMULATOR" build/Build/Products/Debug-iphonesimulator/GymCompanion.app
          mkdir -p capturas
          for style in pwa cristal nativo mixto; do
            for screen in 1-rutinas 2-historial 3-progreso 4-vista-previa 5-entreno 6-tarjeta; do
              xcrun simctl launch --terminate-running-process "$SIMULATOR" com.carcaret.gymcompanion \
                -demo -estilo "$style" -pantalla "${screen#*-}" > /dev/null
              sleep 3
              xcrun simctl io "$SIMULATOR" screenshot "capturas/80-$style-$screen.png"
            done
          done
          ls capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas
          if-no-files-found: ignore

  release:
    needs: [core-linux, pwa-tests, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fechas de los ficheros   # ver el job app
        run: |
          scripts/restore-mtimes.sh
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - uses: actions/cache@v4
        with:
          path: build
          key: app-release-${{ github.sha }}
          restore-keys: app-release-

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild build \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GymCompanion.app Payload/
          zip -qr GymCompanion.ipa Payload
          shasum -a 256 GymCompanion.ipa | tee GymCompanion.ipa.sha256

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest GymCompanion.ipa GymCompanion.ipa.sha256 \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --target ${{ github.sha }}
