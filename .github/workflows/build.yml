# Tests en cada PR y en master. Solo en master, y solo si pasan, compila la app sin firmar y la
# publica como release "latest": la firma (Apple ID gratuito) y la instalación en el iPhone las
# hace el NAS (ios-signer). Si los tests fallan, el iPhone se queda con la versión anterior.
# (El fichero se sigue llamando build.yml para que el número de ejecución, que es el número de
# compilación de la app, siga creciendo.)
name: build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    # Domain y Application no pueden depender de frameworks de Apple: se prueban también en
    # Linux, con la misma imagen que en el NAS.
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests del paquete (Linux)
        working-directory: Packages/GymCore
        env:
          PWA_DB_JSON: ${{ github.workspace }}/pwa/db.json   # los datos reales, para el test de importación
        run: swift test

  pwa-tests:
    # Cada test unitario de la PWA ya portado tiene su gemelo en Swift (mismo describe y nombre)
    # o un motivo en docs/pwa-tests-no-aplican.tsv. Ver CLAUDE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests de la PWA portados
        run: python3 scripts/pwa_tests.py pwa

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          swift --version

      - name: Tests del paquete (macOS)
        working-directory: Packages/GymCore
        run: swift test

      - name: Tests de la app en el simulador
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulador: $udid"
          xcodebuild test \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -destination "id=$udid" \
            -derivedDataPath build \
            -resultBundlePath build/Tests.xcresult \
            | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Extraer capturas
        if: always()
        run: |
          [ -d build/Tests.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path attachments
          mkdir -p capturas
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' attachments/manifest.json \
            | while IFS=$'\t' read -r file name; do cp "attachments/$file" "capturas/${name%%_*}.png"; done
          ls capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas
          if-no-files-found: ignore

  release:
    needs: [core-linux, pwa-tests, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild build \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GymCompanion.app Payload/
          zip -qr GymCompanion.ipa Payload
          shasum -a 256 GymCompanion.ipa | tee GymCompanion.ipa.sha256

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest GymCompanion.ipa GymCompanion.ipa.sha256 \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --target ${{ github.sha }}
