# Tests en cada PR y en master. Solo en master, y solo si pasan, publica la app sin firmar como
# release "latest": la firma (Apple ID gratuito) y la instalación en el iPhone las hace el NAS
# (ios-signer). Si los tests fallan, el iPhone se queda con la versión anterior.
# (El fichero se sigue llamando build.yml para que el número de ejecución, que es el número de
# compilación de la app, siga creciendo.)
#
# Todo va en paralelo, cada cosa en su máquina (el plan gratuito deja 5 macOS a la vez): los tests
# de UI del iPhone en tres partes, el reloj (con el paquete en macOS) y la compilación de la release.
# Cada job con simulador deja en el resumen del run su cronología (también el arranque del
# simulador, que va en segundo plano) y lo que tarda cada test, y sube los logs enteros y el
# .xcresult (con el vídeo de los fallos) como artefacto diagnostico-<job>.
#
# Un test de UI que falla se repite una vez en la misma máquina (decisión del usuario, 2026-10-27:
# un fallo del entorno costaba otro run entero). El resumen del run lista los que han necesitado
# repetirse, y el .xcresult guarda el vídeo del primer intento.
#
# En master no se repiten los tests de lo que ya pasó en su PR con el mismo árbol (job gate,
# scripts/ci-gate.sh): se publica en cuanto compila la release. Los jobs del iPhone y del reloj
# siguen corriendo, sin tests, para dejar en master las cachés que usan las PR.
name: build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write
  actions: read         # gate: el run de la PR
  pull-requests: read   # gate: qué PR se ha fusionado

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.gate.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh

  core-linux:
    # El paquete entero se prueba también en Linux, con la misma imagen que en el NAS: solo
    # AppleAdapters y WatchAdapters, tras `#if canImport`, tocan frameworks de Apple.
    needs: gate
    if: false
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests del paquete (Linux)
        working-directory: Packages/GymCore
        env:
          PWA_DB_JSON: ${{ github.workspace }}/pwa/db.json   # los datos reales, para el test de importación
        run: swift test

  pwa-tests:
    # Cada test de la PWA (unitarios y e2e) tiene su gemelo en Swift (mismo describe y nombre) o
    # un motivo en docs/pwa-tests-no-aplican.tsv, y la tabla de docs/paridad.md está al día. Ver
    # CLAUDE.md.
    needs: gate
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carcaret/gym-companion
          path: pwa
      - name: Tests de la PWA portados
        run: python3 scripts/pwa_tests.py pwa --check-table

  app:
    # Los tests de UI del iPhone, en tres partes en paralelo. La 1 corre las clases de PART_1, la 2
    # las de PART_2 y la 3 todas las demás, para que una clase nueva nunca se quede sin correr. Si
    # una parte tarda mucho más que las otras, se mueve una clase (el resumen dice lo que tarda
    # cada test).
    name: app (${{ matrix.part }})
    needs: gate
    if: false
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      TESTED: ${{ needs.gate.outputs.tested }}
      # Medido el 2026-10-26: unos 230-250 s de tests en cada parte. Cada parte corre sus clases por
      # orden alfabético. SettingsTests va detrás de KeyboardTests: es el primer test que teclea y,
      # con el teclado sin estrenar, tarda más de 5 s en salir. NavigationTests, sin KeyboardTests
      # delante: con ellos, el gesto de volver de testDeslizarAMediasNoCierraElDetalleDelHistorial
      # falló 3 de 4 veces. La 3, todas las demás (también las nuevas).
      PART_1: DisclosureTests KeyboardTests SettingsTests SyncMenuTests TypingTests
      PART_2: NavigationTests WorkoutTests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para restore-mtimes.sh
      - name: Inicio
        run: scripts/ci-start.sh

      # Compilación incremental: la carpeta de compilación de Xcode de la última ejecución, con
      # cada fichero en la fecha de su commit para que solo se recompile lo que cambia. Las
      # ejecuciones de master guardan la caché que usan las PR.
      - name: Fechas de los ficheros
        run: scripts/restore-mtimes.sh
      - uses: actions/cache@v4
        with:
          path: build
          key: app-debug-${{ github.sha }}
          restore-keys: app-debug-

      - name: Generar proyecto
        run: |
          scripts/ci-xcodegen.sh
          xcodebuild -version
          swift --version
          scripts/ci-timeline.sh mark "proyecto generado"

      - name: Simulador
        id: sim
        uses: ./.github/actions/simulator-start
        with:
          kind: iphone

      - name: Compilar la app y los tests
        run: |
          scripts/ci-xcodebuild.sh build.log 40 "app compilada" build-for-testing \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Esperar al simulador
        run: scripts/ci-simulator.sh wait

      - name: Tests de la app en el simulador
        if: env.TESTED != 'true'
        run: |
          # Primero a una variable: así, si el script falla, falla el paso.
          classes=$(scripts/ci-ui-selection.sh "${{ matrix.part }}")
          selection=()
          while IFS= read -r arg; do selection+=("$arg"); done <<< "$classes"
          scripts/ci-timeline.sh mark "tests: empiezan"
          scripts/ci-xcodebuild.sh test.log 60 "tests: terminan" test-without-building \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath Tests.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            "${selection[@]}"

      - name: Fin
        if: always()
        uses: ./.github/actions/simulator-finish
        with:
          sim-key: ${{ steps.sim.outputs.key }}
          xcresult: Tests.xcresult
          title: app (${{ matrix.part }})
          tests-title: Tests de app (${{ matrix.part }})
          capturas: capturas-${{ matrix.part }}
          diagnostico: diagnostico-app-${{ matrix.part }}

  watch:
    # La app del reloj, con su propio esquema y su simulador (capturas del reloj), y al final los
    # tests del paquete en macOS: este job acaba mucho antes que los del iPhone, y así no hacen
    # falta más de 5 máquinas a la vez.
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: macos-26
    env:
      TESTED: ${{ needs.gate.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inicio
        run: scripts/ci-start.sh

      - name: Fechas de los ficheros   # ver el job app
        run: scripts/restore-mtimes.sh
      - uses: actions/cache@v4
        with:
          path: build
          key: watch-debug-${{ github.sha }}
          restore-keys: watch-debug-
      - uses: actions/cache@v4
        with:
          path: Packages/GymCore/.build
          key: core-macos-${{ github.sha }}
          restore-keys: core-macos-

      - name: Generar proyecto
        run: |
          scripts/ci-xcodegen.sh
          scripts/ci-timeline.sh mark "proyecto generado"

      - name: Simulador
        id: sim
        uses: ./.github/actions/simulator-start
        with:
          kind: watch

      - name: Compilar el reloj y sus tests
        run: |
          scripts/ci-xcodebuild.sh build.log 40 "reloj compilado" build-for-testing \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanionWatch \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO

      # Sin icono el reloj enseña la app con un círculo vacío, y ningún test lo ve.
      - name: El reloj lleva icono
        run: |
          app=build/Build/Products/Debug-watchsimulator/GymCompanionWatch.app
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")
          test "$icon" = AppIcon
          test -f "$app/Assets.car"

      - name: Esperar al simulador
        run: scripts/ci-simulator.sh wait

      - name: Tests del reloj en el simulador
        if: env.TESTED != 'true'
        run: |
          scripts/ci-timeline.sh mark "tests: empiezan"
          scripts/ci-xcodebuild.sh test.log 40 "tests: terminan" test-without-building \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanionWatch \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath Watch.xcresult \
            -only-testing:GymCompanionWatchUITests/WatchScreenshotTests/testEntreno

      - name: Fin
        if: always()
        uses: ./.github/actions/simulator-finish
        with:
          sim-key: ${{ steps.sim.outputs.key }}
          xcresult: Watch.xcresult
          title: watch
          tests-title: Tests del reloj
          capturas: capturas-reloj
          diagnostico: diagnostico-watch

      - name: Tests del paquete (macOS)
        if: false
        working-directory: Packages/GymCore
        run: swift test

  capturas:
    # Las capturas de las tres partes y del reloj, juntas en un solo artefacto "capturas".
    needs: [app, watch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: capturas
          pattern: capturas-*
          delete-merged: true
        continue-on-error: true   # sin capturas (falló la compilación) no hay nada que juntar

  release-build:
    if: false
    # La release se compila a la vez que corren los tests (también en las PR: así se sabe que
    # compila en Release) y solo se publica, en el job publish, si todo pasa en master.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fechas de los ficheros   # ver el job app
        run: scripts/restore-mtimes.sh
      - uses: actions/cache@v4
        with:
          path: build
          key: app-release-${{ github.sha }}
          restore-keys: app-release-

      - name: Generar proyecto
        run: |
          scripts/ci-xcodegen.sh

      - name: Compilar (sin firmar)
        run: |
          scripts/ci-xcodebuild.sh release.log 30 "release compilada" build \
            -project GymCompanion.xcodeproj \
            -scheme GymCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      # Salud (#17): plumesign activa en cada App ID las capacidades que lleva su binario (#3), y se
      # compila sin firmar. Se firma ad hoc con los entitlements, de dentro afuera: primero el
      # reloj, que va dentro de la app del iPhone. Si alguno no los lleva, falla.
      - name: Firmar ad hoc con los entitlements
        run: |
          app=build/Build/Products/Release-iphoneos/GymCompanion.app
          watch="$app/Watch/GymCompanionWatch.app"
          codesign --force --sign - --entitlements Entitlements/GymCompanionWatch.entitlements "$watch"
          codesign --force --sign - --entitlements Entitlements/GymCompanion.entitlements "$app"
          for bundle in "$watch" "$app"; do
            codesign -d --entitlements - --xml "$bundle" | grep -q com.apple.developer.healthkit
          done

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GymCompanion.app Payload/
          zip -qr GymCompanion.ipa Payload
          shasum -a 256 GymCompanion.ipa | tee GymCompanion.ipa.sha256
          rm -rf build/Index.noindex build/Logs   # lo que no sirve a la caché (ver simulator-finish)

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: |
            GymCompanion.ipa
            GymCompanion.ipa.sha256
          retention-days: 7

  publish:
    needs: [gate, core-linux, pwa-tests, app, watch, release-build]
    if: github.event_name == 'push' && needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipa
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-publish.sh

  # Lo mismo, sin esperar a los jobs de tests, cuando el gate dice que ya pasaron en la PR.
  publish-tested:
    needs: [gate, release-build]
    if: github.event_name == 'push' && needs.gate.outputs.tested == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipa
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-publish.sh
