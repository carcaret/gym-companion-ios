# Proyecto de Xcode generado con XcodeGen (el .xcodeproj no se versiona).
name: GymCompanion
options:
  bundleIdPrefix: com.carcaret
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"   # el workflow lo sustituye por el número de ejecución
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GymCore:
    path: Packages/GymCore
targets:
  GymCompanion:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GymCore
        product: Domain
      - package: GymCore
        product: Application
      - package: GymCore
        product: Adapters
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gym
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carcaret.gymcompanion
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [GymCompanionUITests]
      gatherCoverageData: false
  GymCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GymCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carcaret.gymcompanion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GymCompanion
