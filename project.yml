# Proyecto de Xcode generado con XcodeGen (el .xcodeproj no se versiona).
name: GymCompanion
options:
  bundleIdPrefix: com.carcaret
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"   # el workflow lo sustituye por el número de ejecución
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GymCore:
    path: Packages/GymCore
targets:
  GymCompanion:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GymCore
        product: Domain
      - package: GymCore
        product: Application
      - package: GymCore
        product: ViewModels
      - package: GymCore
        product: Presentation
      - package: GymCore
        product: Adapters
      - package: GymCore
        product: AppleAdapters
      - package: GymCore
        product: WatchAdapters
      - package: GymCore
        product: HealthAdapters
      # La app del reloj va dentro (Watch/); ios-signer la instala directamente en el reloj (#2).
      - target: GymCompanionWatch
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gym
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark   # siempre en oscuro, como la PWA
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Salud (#17): el iPhone abre el reloj al empezar el entreno. Los entitlements van en
        # Entitlements/ y los firma el CI (ver build.yml).
        NSHealthShareUsageDescription: Gym lee el pulso y las kcal del entreno para enseñártelos en el reloj.
        NSHealthUpdateUsageDescription: Gym guarda cada entreno en Salud como fuerza tradicional.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carcaret.gymcompanion
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # El color de la app (Theme.accentLight): el sistema decide dónde va, sin `.tint` en la raíz.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [GymCompanionUITests]
      gatherCoverageData: false
  GymCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    # Los argumentos de arranque y los identificadores de accesibilidad, los mismos que la app.
    sources: [UITests, App/Shared/LaunchArgument.swift, App/Shared/AccessibilityID.swift]
    dependencies:
      - target: GymCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carcaret.gymcompanion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GymCompanion
  # App del reloj (#16, #17): la app de entreno. Mide el entreno en Salud y enseña lo que le envía el
  # iPhone. Comparte con la app los datos de ejemplo de las capturas, los argumentos de arranque, los
  # identificadores de accesibilidad, los colores y el icono (el catálogo de la app lo trae para iOS y
  # watchOS).
  GymCompanionWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - App/Demo/DemoData.swift
      - App/Shared/LaunchArgument.swift
      - App/Shared/AccessibilityID.swift
      - App/Shared/Theme.swift
      - App/Assets.xcassets
    dependencies:
      - package: GymCore
        product: Domain
      - package: GymCore
        product: Presentation
      - package: GymCore
        product: Application
      - package: GymCore
        product: ViewModels
      - package: GymCore
        product: Adapters
      - package: GymCore
        product: WatchAdapters
      - package: GymCore
        product: HealthAdapters
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Gym
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # plumesign lo reescribe con el team ID, igual que el identificador del bundle.
        WKCompanionAppBundleIdentifier: com.carcaret.gymcompanion
        # La sesión de entreno sigue con la pantalla apagada y la app vuelve al levantar la muñeca.
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Gym lee el pulso y las kcal del entreno para enseñártelos.
        NSHealthUpdateUsageDescription: Gym guarda cada entreno en Salud como fuerza tradicional.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carcaret.gymcompanion.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [GymCompanionWatchUITests]
      gatherCoverageData: false
  GymCompanionWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    # Lo mismo que en los tests del iPhone: las esperas (`appears(timeout:)`), las capturas, los
    # argumentos de arranque y los identificadores de accesibilidad.
    sources: [WatchUITests, UITests/Waiting.swift, UITests/Capture.swift, App/Shared/LaunchArgument.swift,
              App/Shared/AccessibilityID.swift]
    dependencies:
      - target: GymCompanionWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carcaret.gymcompanion.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GymCompanionWatch
